---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "wetty_container_http_bind_port", "new": "wetty_container_http_host_bind_port" }
    - { "old": "wetty_ssh_host", "new": "wetty_environment_variables_ssh_host" }
    - { "old": "wetty_ssh_port", "new": "wetty_environment_variables_ssh_port" }
    - { "old": "wetty_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Wetty settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - wetty_uid
    - wetty_gid
    - wetty_hostname
    - wetty_path_prefix
    - wetty_container_network
    - wetty_environment_variables_ssh_host

- name: Run if Traefik is enabled
  when: wetty_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Wetty are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - wetty_container_labels_traefik_hostname
        - wetty_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `wetty_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if wetty_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          wetty_container_labels_traefik_path_prefix (`{{ wetty_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/wetty`).
      when: "wetty_container_labels_traefik_path_prefix != '/' and wetty_container_labels_traefik_path_prefix[-1] == '/'"
