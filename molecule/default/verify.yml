---
- name: Verify Wetty systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for Wetty service to become active (up to 180s)
      ansible.builtin.systemd:
        name: wetty.service
      register: wetty_service
      until: wetty_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Wetty service is active
      ansible.builtin.assert:
        that: wetty_service.status.ActiveState == 'active'
        fail_msg: "wetty.service not active ({{ wetty_service.status.ActiveState }})"
        success_msg: "wetty.service is active"

    - name: Retrieve Wetty service log for debugging
      when: wetty_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu wetty.service
      changed_when: false

    - name: Wait for Wetty HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:3000/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: wetty_endpoint
      until: wetty_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert Wetty HTTP endpoint responds
      ansible.builtin.assert:
        that: wetty_endpoint.status in [200, 302]
        fail_msg: "Wetty did not respond as expected ({{ wetty_endpoint.status | default('no response') }})"
        success_msg: "Wetty responded with {{ wetty_endpoint.status }}"

    - name: Show Wetty systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Wetty systemd: {{ wetty_service.status.ActiveState }}"
          - "Wetty HTTP: {{ wetty_endpoint.status }}"
